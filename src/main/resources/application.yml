spring:
  application:
    name: java-maven-api-template
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: ${REDIS_TIMEOUT:5000}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

sentry:
  dsn: ${SENTRY_DSN:}
  enabled: ${SENTRY_ENABLED:false}

cache:
  enabled: ${CACHE_ENABLED:false}
  name: ${CACHE_NAME:cache}
  ttl: ${CACHE_TTL:300}
